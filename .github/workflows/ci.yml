name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deny-all at the workflow level; grant the minimum per job.
permissions: {}

# Deterministic, network-light runs: no telemetry calls or update nags that can
# add latency/flake when many runs execute in parallel.
env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

concurrency:
  # One in-flight run per PR / branch. PRs key on refs/pull/<n>/merge and pushes on
  # refs/heads/<branch>, so concurrent PRs NEVER cancel each other — only a newer
  # push to the SAME ref supersedes an older, still-running one. This isolates the
  # parallel work of multiple agents/branches.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit + integration on a hermetic, ephemeral runner (its own FS/ports/containers),
  # so parallel runs cannot collide. E2E is intentionally NOT run here: the Playwright
  # suites are serial and target the SHARED DinD host, so running them in this pipeline
  # would race across concurrent PRs. E2E runs locally on an isolated per-agent slot —
  # see scripts/e2e-deploy.sh and CONTRIBUTING.md.
  verify:
    name: Verify · lint · typecheck · test · build
    runs-on: ubuntu-latest
    # Cap a hung run so it can't hold a shared runner slot away from parallel work.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to commit SHAs (supply-chain hardening).
      # `persist-credentials: false`: checkout DEFAULTS to leaving the job's token in .git/config,
      # where anything that executes during the run — a build script, a test-time dependency — can
      # read it. Nothing here talks to git over the network after checkout, so drop it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Reads the pnpm version from package.json "packageManager".
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ONE gate step: `scripts/verify.mjs` is shared with `pnpm verify`, so what a contributor runs
      # locally and what CI enforces cannot drift. That drift is what kept turning main red — the old
      # `pnpm verify` skipped the dependency audit and the generated-file drift checks, which together
      # account for most of this repo's historical CI failures. Add gates in the SCRIPT, not here.
      # It emits ::group:: sections + per-gate timings, so the log stays as readable as separate steps.
      - name: Verify (audit, generated-file drift, typecheck, lint, build, test)
        run: pnpm verify

  # Snapshot functionality (the MCP `preview_page` screenshots) can't run in the hermetic unit suite —
  # it needs a real browser. The image ships a heavily-slimmed Chromium (headless-shell only, Mesa/LLVM
  # stripped — see apps/api/Dockerfile), so a stripped dep could silently break rendering. This job
  # builds the ACTUAL runtime image and renders a real screenshot INSIDE it, so any regression in the
  # render path OR the image's dependency set fails CI. Runs in parallel with `verify`.
  snapshot:
    name: Snapshot smoke · renders in the runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The runtime image is built from a `pnpm deploy --prod` output (resolved node_modules + dist).
      - name: Build API
        run: pnpm --filter "@sitewright/api..." build

      - name: Assemble deploy output
        run: |
          pnpm --filter @sitewright/api deploy --prod /tmp/deploy
          mkdir -p /tmp/deploy/editor   # the Dockerfile COPYs editor/; the smoke doesn't serve the SPA

      - name: Build runtime image
        run: docker build -t sw-snapshot -f apps/api/Dockerfile /tmp/deploy

      # Render a real screenshot (Latin + CJK + emoji) INSIDE the image, asserting both viewports produce
      # a plausible JPEG — proves the slimmed Chromium (Mesa/LLVM stripped, fonts kept) still renders.
      - name: Render a screenshot inside the runtime image
        run: |
          docker run --rm --workdir /app -v "$PWD/apps/api/scripts:/smoke:ro" \
            --entrypoint node sw-snapshot /smoke/snapshot-smoke.mjs
