name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deny-all at the workflow level; grant the minimum per job.
permissions: {}

# Deterministic, network-light runs: no telemetry calls or update nags that can
# add latency/flake when many runs execute in parallel.
env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

concurrency:
  # One in-flight run per PR / branch. PRs key on refs/pull/<n>/merge and pushes on
  # refs/heads/<branch>, so concurrent PRs NEVER cancel each other — only a newer
  # push to the SAME ref supersedes an older, still-running one. This isolates the
  # parallel work of multiple agents/branches.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit + integration on a hermetic, ephemeral runner (its own FS/ports/containers),
  # so parallel runs cannot collide. E2E is intentionally NOT run here: the Playwright
  # suites are serial and target the SHARED DinD host, so running them in this pipeline
  # would race across concurrent PRs. E2E runs locally on an isolated per-agent slot —
  # see scripts/e2e-deploy.sh and CONTRIBUTING.md.
  verify:
    name: Verify · lint · typecheck · test · build
    runs-on: ubuntu-latest
    # Cap a hung run so it can't hold a shared runner slot away from parallel work.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to commit SHAs (supply-chain hardening).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        # Reads the pnpm version from package.json "packageManager".
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails the build on high/critical advisories.
      #
      # `pnpm.auditConfig.ignoreGhsas` is EMPTY and should stay that way: an
      # exemption silently outlives the advisory that justified it (all three
      # former entries did — one had already stopped matching the tree). Fix by
      # pinning in pnpm.overrides instead, so the audit keeps telling the truth.
      #
      # Two advisories remain, both BELOW the gate, neither reachable here:
      # - GHSA-g7r4-m6w7-qqqr (esbuild <0.28.1, low): arbitrary file read via the
      #   esbuild DEV SERVER, on Windows. Reached only through vitest -> vite, so
      #   it is test-tooling that never runs in prod, and we run Linux. A blanket
      #   esbuild override is not viable (vite pins 0.25; 0.28 drops transpile
      #   support for our editor browser targets) — re-check on the next vite bump.
      # - GHSA-8988-4f7v-96qf (@opentelemetry/core <2.8.0, moderate): unbounded
      #   allocation parsing W3C Baggage headers, via lighthouse -> @sentry/node.
      #   Sentry pins otel 1.x, so clearing it means forcing a MAJOR into a
      #   third-party dep; Lighthouse runs against our OWN locally-served build and
      #   never parses attacker-supplied baggage. Revisit when Sentry ships otel 2.
      - name: Audit dependencies
        # `pnpm audit` (pnpm 9) calls npm's quick-audit endpoint, which npm RETIRED
        # (HTTP 410 -> ERR_PNPM_AUDIT_BAD_RESPONSE). That is an npm-side infra change,
        # not a vulnerability, and there is nothing to act on until pnpm ships support
        # for the bulk advisory endpoint. Treat ONLY that specific transport error as a
        # (warned) skip; a real high/critical advisory still fails the build.
        run: |
          set +e
          out="$(pnpm audit --audit-level high 2>&1)"; code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ] && printf '%s' "$out" | grep -q 'ERR_PNPM_AUDIT_BAD_RESPONSE'; then
            echo "::warning::pnpm audit skipped — npm retired the audit endpoint (410); re-enable when pnpm uses the bulk advisory endpoint"
            exit 0
          fi
          exit $code

      # Guard against hand-edits / upstream drift of the generated brand-icons set.
      - name: Check generated brand icons are up to date
        run: pnpm --filter @sitewright/blocks gen:brand-icons:check

      # Same guard for the generated country-flag set (flag-icons + circle-flags).
      - name: Check generated flag icons are up to date
        run: pnpm --filter @sitewright/blocks gen:flag-icons:check

      # Same guard for the vendored component runtimes (Embla carousel / GLightbox bundles).
      - name: Check generated vendor component runtimes are up to date
        run: pnpm --filter @sitewright/blocks gen:vendor:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Build before test: some integration tests assert on built output.
      - name: Build
        run: pnpm build

      - name: Test (with coverage gate)
        run: pnpm test

  # Snapshot functionality (the MCP `preview_page` screenshots) can't run in the hermetic unit suite —
  # it needs a real browser. The image ships a heavily-slimmed Chromium (headless-shell only, Mesa/LLVM
  # stripped — see apps/api/Dockerfile), so a stripped dep could silently break rendering. This job
  # builds the ACTUAL runtime image and renders a real screenshot INSIDE it, so any regression in the
  # render path OR the image's dependency set fails CI. Runs in parallel with `verify`.
  snapshot:
    name: Snapshot smoke · renders in the runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The runtime image is built from a `pnpm deploy --prod` output (resolved node_modules + dist).
      - name: Build API
        run: pnpm --filter "@sitewright/api..." build

      - name: Assemble deploy output
        run: |
          pnpm --filter @sitewright/api deploy --prod /tmp/deploy
          mkdir -p /tmp/deploy/editor   # the Dockerfile COPYs editor/; the smoke doesn't serve the SPA

      - name: Build runtime image
        run: docker build -t sw-snapshot -f apps/api/Dockerfile /tmp/deploy

      # Render a real screenshot (Latin + CJK + emoji) INSIDE the image, asserting both viewports produce
      # a plausible JPEG — proves the slimmed Chromium (Mesa/LLVM stripped, fonts kept) still renders.
      - name: Render a screenshot inside the runtime image
        run: |
          docker run --rm --workdir /app -v "$PWD/apps/api/scripts:/smoke:ro" \
            --entrypoint node sw-snapshot /smoke/snapshot-smoke.mjs
