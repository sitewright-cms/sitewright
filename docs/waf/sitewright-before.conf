# Sitewright — OWASP CRS 4 rule exclusions (load as a CRS plugin "before" file, or include it after
# crs-setup.conf and before the CRS rules). See docs/waf.md for what each section is for, what was
# measured, and what it costs. Anonymous traffic stays inspected; two kinds of request are treated
# differently, each for a reason the WAF cannot see on its own:
#
#   1. AUTHORING WRITES: the editor and agents (MCP, access keys) send site SOURCE CODE — HTML, CSS,
#      JavaScript, `{{ }}` templates — in request bodies by design. A write to the authoring API that
#      carries a credential in Sitewright's exact format is not inspected. The WAF checks the FORMAT,
#      not the credential: anyone can send a well-formed fake, which Sitewright then refuses (401). Such
#      a request still meets the request-line, header and scanner checks, which block early for it.
#   2. Narrow spots where Sitewright's own protocol meets a default policy: the statistics beacon's
#      content type, agents' upload links, local apps' OAuth redirect URI, passwords at sign-in, and
#      payment webhooks.
#
# Rule ids 10100-10199 (the local-use range).

# ── 1. Authenticated authoring traffic ─────────────────────────────────────────────────────────
# A Sitewright bearer token: an access key, a member token or an OAuth-issued key (`swk_`/`swm_`
# + 64 hex). The editor's session cookie: `sw_session` (`__Host-sw_session` over HTTPS), a 64-hex id
# and its signature. The WAF cannot tell a real one from a well-formed fake; Sitewright refuses the
# fake (401) before it acts on anything in the request.
SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer sw[km]_[0-9a-f]{64}\z" \
    "id:10100,phase:1,pass,nolog,setvar:'tx.sw_credential=1'"
SecRule REQUEST_COOKIES:/^(?:__Host-)?sw_session$/ "@rx ^[0-9a-f]{64}\.[A-Za-z0-9_-]{43}\z" \
    "id:10101,phase:1,pass,nolog,setvar:'tx.sw_credential=1'"

# The authenticated API: projects (content, media, settings, publish, deploy …), the operator's
# admin area, the signed-in user's account, the global library and the MCP endpoint. Saves use PUT,
# PATCH and DELETE, which the default method policy refuses.
SecRule TX:sw_credential "@eq 1" \
    "id:10110,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:projects|admin|account|global|mcp|api-key|me|ai|invites)(?:/|\z)" \
        "setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"
# …and a WRITE there carries source code: its body is not inspected, nor capped at 128 KB and 1,000
# values, so a large page or settings save goes through. ModSecurity v3 then skips the whole
# request-body phase, the query string included — so reads (GET/HEAD) are left out of this and stay
# fully inspected, and EARLY BLOCKING is switched on for the write: the anomaly score from the
# request line, the headers and scanner detection is evaluated at the end of phase 1 instead of in the
# phase that no longer runs.
SecRule TX:sw_credential "@eq 1" \
    "id:10111,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|OPTIONS)\z" \
        "chain"
        SecRule REQUEST_FILENAME "@rx ^/(?:projects|admin|account|global|mcp|api-key|me|ai|invites)(?:/|\z)" \
            "ctl:requestBodyAccess=Off,\
            setvar:'tx.early_blocking=1'"

# ── 2. Public endpoints with a content type outside the default policy ─────────────────────────
# Statistics beacon: one tiny text/plain POST per pageview (navigator.sendBeacon). Sitewright caps
# it at 1 KB, checks a signature before any I/O and always answers 204.
SecRule REQUEST_METHOD "@streq POST" \
    "id:10120,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@rx ^/a/[A-Za-z0-9_-]{1,64}\z" \
        "ctl:ruleRemoveById=920420"

# Single-use upload links an agent PUTs file bytes to (`curl -T`). Raw bytes carry no arguments to
# inspect; the link is a random, single-use, short-lived token. `curl -T` sends no content type at all
# (920340, 920640), and with a body over 1 MB `Expect: 100-continue`, a header the default policy
# refuses (920450). Uploads over ModSecurity's 12.5 MB body limit need a proxy route around the WAF —
# see docs/waf.md, "Uploads".
SecRule REQUEST_METHOD "@streq PUT" \
    "id:10130,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@rx ^/media-upload/[0-9a-f-]{36}\z" \
        "ctl:requestBodyAccess=Off,\
        ctl:ruleRemoveById=920340,\
        ctl:ruleRemoveById=920420,\
        ctl:ruleRemoveById=920450,\
        ctl:ruleRemoveById=920640,\
        setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT',\
        setvar:'tx.early_blocking=1'"

# ── 3. OAuth sign-in from apps on the user's machine ───────────────────────────────────────────
# The Sitewright CLI and desktop MCP clients (Claude Code, VS Code, Cursor …) sign in with a LOOPBACK
# redirect URI — `http://127.0.0.1:8976/callback`, `http://localhost:53127/callback` (RFC 8252 §7.3):
# a URL pointing at an IP address or at localhost, exactly what the remote-file-inclusion and SSRF
# rules look for. Only that one parameter is exempted from those rules; Sitewright accepts a redirect
# URI only when the client registered it, and only redirects the user's own browser to it.
SecRule REQUEST_FILENAME "@rx ^/oauth/(?:authorize|token)\z" \
    "id:10140,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=931130;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=934110;ARGS:redirect_uri"
# Dynamic client registration sends the same URIs as a JSON array — at most five (Sitewright refuses
# more), listed one by one: ModSecurity v3 takes no pattern in a target exclusion.
SecRule REQUEST_FILENAME "@streq /oauth/register" \
    "id:10141,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_0,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_1,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_2,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_3,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_4,\
    ctl:ruleRemoveTargetById=931130;ARGS:json.redirect_uris.array_0,\
    ctl:ruleRemoveTargetById=931130;ARGS:json.redirect_uris.array_1,\
    ctl:ruleRemoveTargetById=931130;ARGS:json.redirect_uris.array_2,\
    ctl:ruleRemoveTargetById=931130;ARGS:json.redirect_uris.array_3,\
    ctl:ruleRemoveTargetById=931130;ARGS:json.redirect_uris.array_4,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_0,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_1,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_2,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_3,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_4"

# ── 4. Passwords at sign-in and registration ───────────────────────────────────────────────────
# A generated password is a random string of symbols — `<script`, a backtick or `;--` in it trips the
# XSS, command and SQL injection rules and the user can no longer sign in. A password is only ever
# hashed, never interpreted. (Password changes are authenticated, so section 1 covers them.)
SecRule REQUEST_FILENAME "@rx ^/auth/(?:login|register)\z" \
    "id:10150,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password"

# ── 5. Payment-provider webhooks ───────────────────────────────────────────────────────────────
# A provider's event can name a field `session_id` (Sitewright's payment gateways are configurable),
# which the session-fixation rule refuses when no Referer comes with it — and a server-to-server
# webhook never has one. Sitewright takes its session only from its own cookie, never from a
# parameter, so that rule protects nothing here; a refused webhook is an order never marked paid.
SecRule REQUEST_METHOD "@streq POST" \
    "id:10170,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@rx ^/pay/[A-Za-z0-9_-]{1,64}/webhook/[A-Za-z0-9_-]{1,64}\z" \
        "ctl:ruleRemoveById=943120"

# ── Optional: forms whose visitors write code ──────────────────────────────────────────────────
# A contact message that QUOTES code — an HTML tag (`<script>`, `<img src=…>`), a Unix path
# (`/etc/…`), a command in backticks — is refused at paranoia level 1, and the submission is lost
# (the visitor sees the form's error). Sitewright stores and mails submissions as text and never
# renders them as HTML. If a site's visitors routinely write code (a developer audience, a support
# form), uncomment this to stop checking form submissions for XSS, file-access and command patterns
# (every field, and the query string; SQL injection stays checked). The form endpoint's own spam
# guards (proof of work, honeypot, timing, captcha) still apply.
#SecRule REQUEST_FILENAME "@rx ^/f/[A-Za-z0-9_-]{1,64}/[A-Za-z0-9_-]{1,64}\z" \
#    "id:10160,phase:1,pass,nolog,\
#    ctl:ruleRemoveTargetByTag=attack-xss;ARGS,\
#    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS,\
#    ctl:ruleRemoveTargetByTag=attack-rce;ARGS"
