# Sitewright — what an OWASP CRS 4 WAF has to leave alone, if you keep one in front of Sitewright at all.
# See docs/waf.md: a WAF is NOT recommended in front of Sitewright, and this file is the list of
# exceptions for when one stays anyway. Load it as a CRS plugin "before" file, or include it after
# crs-setup.conf and before the CRS rules. Exceptions by PATH only, so any WAF that can exclude a path can
# do the same; nothing here depends on a header, a cookie or a credential's format.
#
# Rule ids 10100-10199 (the local-use range).

# ── 1. The editor's and agents' API: not inspected ────────────────────────────────────────────────
# Writing site source code (HTML, CSS, JavaScript, `{{ }}` templates) is what this API is for, in
# fields whose names the author chooses, with PUT, PATCH and DELETE, in bodies up to 4 MB (60 MB for
# a message to the on-page agent). No rule set tells that apart from an attack. Every write here needs
# a session or an access key, and Sitewright checks it before it parses the body; agents' upload links
# carry a single-use ticket, checked the same way.
#
# With nginx, prefer routing these paths around ModSecurity altogether (a `location` with
# `modsecurity off;`, see docs/waf.md, "Large bodies and memory"): ModSecurity holds a whole body in
# memory before it decides, and uploads go up to 200 MB. This rule is for a WAF that only takes rules.
# Every Core Rule Set rule is removed for these paths and the body is not inspected — but the engine
# stays ON. Do not use `ctl:ruleEngine=Off` instead: with the engine off, ModSecurity also stops
# enforcing its body limit (SecRequestBodyLimit, 12.5 MB) while its nginx connector still reads the
# whole body. Measured: one anonymous 150 MB upload to such a path took the WAF from 170 MiB to 506 MiB.
# With the engine on, a larger body is refused, so uploads over 12.5 MB fail behind this rule alone.
SecRule REQUEST_FILENAME "@rx ^/(?:projects|admin|account|invites|mcp|media-upload)(?:/|\z)" \
    "id:10100,phase:1,pass,nolog,ctl:ruleRemoveByTag=OWASP_CRS,ctl:requestBodyAccess=Off"

# ── 2. The statistics beacon ──────────────────────────────────────────────────────────────────────
# One tiny text/plain POST per pageview (navigator.sendBeacon), a content type outside the default
# policy. Sitewright caps it at 1 KB, checks a signature before any I/O and always answers 204.
SecRule REQUEST_METHOD "@streq POST" \
    "id:10120,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@rx ^/a/[A-Za-z0-9_-]{1,64}\z" \
        "ctl:ruleRemoveById=920420"

# ── 3. OAuth sign-in from apps on the user's machine ──────────────────────────────────────────────
# The Sitewright CLI and desktop MCP clients (Claude Code, VS Code, Cursor …) sign in with a LOOPBACK
# redirect URI — `http://127.0.0.1:8976/callback`, `http://localhost:53127/callback` (RFC 8252 §7.3):
# a URL pointing at an IP address or at localhost, exactly what the remote-file-inclusion and SSRF
# rules look for. Only that one parameter is exempted from those rules; Sitewright accepts a redirect
# URI only when the client registered it, and only redirects the user's own browser to it.
SecRule REQUEST_FILENAME "@rx ^/oauth/(?:authorize|token)\z" \
    "id:10140,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=931130;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=934110;ARGS:redirect_uri"
# Dynamic client registration sends the same URIs as a JSON array — at most five (Sitewright refuses
# more), listed one by one: ModSecurity v3 takes no pattern in a target exclusion.
SecRule REQUEST_FILENAME "@streq /oauth/register" \
    "id:10141,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_0,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_1,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_2,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_3,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_4,\
    ctl:ruleRemoveTargetById=931130;ARGS:json.redirect_uris.array_0,\
    ctl:ruleRemoveTargetById=931130;ARGS:json.redirect_uris.array_1,\
    ctl:ruleRemoveTargetById=931130;ARGS:json.redirect_uris.array_2,\
    ctl:ruleRemoveTargetById=931130;ARGS:json.redirect_uris.array_3,\
    ctl:ruleRemoveTargetById=931130;ARGS:json.redirect_uris.array_4,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_0,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_1,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_2,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_3,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_4"

# ── 4. Passwords at sign-in and registration ──────────────────────────────────────────────────────
# A generated password is a random string of symbols — `<script`, a backtick or `;--` in it trips the
# XSS, command and SQL injection rules and the user can no longer sign in. A password is only ever
# hashed, never interpreted. (Password changes go to /account, section 1.)
SecRule REQUEST_FILENAME "@rx ^/auth/(?:login|register)\z" \
    "id:10150,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password"

# ── 5. Payment-provider webhooks ──────────────────────────────────────────────────────────────────
# A provider's event can name a field `session_id` (Sitewright's payment gateways are configurable),
# which the session-fixation rule refuses when no Referer comes with it — and a server-to-server
# webhook never has one. Sitewright takes its session only from its own cookie, never from a
# parameter, so that rule protects nothing here; a refused webhook is an order never marked paid.
SecRule REQUEST_METHOD "@streq POST" \
    "id:10170,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@rx ^/pay/[A-Za-z0-9_-]{1,64}/webhook/[A-Za-z0-9_-]{1,64}\z" \
        "ctl:ruleRemoveById=943120"

# ── Optional: forms whose visitors write code ─────────────────────────────────────────────────────
# A contact message that QUOTES code — an HTML tag (`<script>`, `<img src=…>`), a Unix path
# (`/etc/…`), a command in backticks — is refused at paranoia level 1, and the submission is lost
# (the visitor sees the form's error). Sitewright stores and mails submissions as text and never
# renders them as HTML. If a site's visitors routinely write code (a developer audience, a support
# form), uncomment this to stop checking form submissions for XSS, file-access and command patterns
# (every field, and the query string; SQL injection stays checked). The form endpoint's own spam
# guards (proof of work, honeypot, timing, captcha) still apply.
