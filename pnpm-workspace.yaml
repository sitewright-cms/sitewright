packages:
  - "packages/*"
  - "apps/*"

# ─────────────────────────────────────────────────────────────────────────────
# Everything below used to live in the root package.json "pnpm" field. pnpm 11
# NO LONGER READS THAT FIELD — it prints a WARN and carries on, which means an
# upgrade that forgets this file silently drops every CVE override and the
# install-script allowlist while still exiting 0. Keep these here.
# ─────────────────────────────────────────────────────────────────────────────

# Dependency cooldown: refuse to resolve a version published less than this many
# minutes ago. This is the control that actually defeats registry-compromise
# worms — a malicious release is typically yanked within hours (Shai-Hulud ~12h,
# the chalk/debug compromise ~2.5h), so anything that waits is never exposed.
# pnpm 11 defaults to 1440 (1 day). 3 days still clears every recent incident by
# a wide margin, and the extra headroom is deliberately NOT larger than that
# because of a real tension: the `overrides` block below exists to adopt security
# patches PROMPTLY, and a long cooldown fights that. A 7-day window was tried
# first and rejected three packages our own CVE overrides had pulled in
# (brace-expansion, fast-uri, ip-address — all patch releases days old).
#
# When an urgent advisory lands and the fix is younger than the cooldown, do NOT
# lower this globally: add just that package to minimumReleaseAgeExclude below,
# with a comment, and remove it once the version has aged out.
#
# ★ This is enforced on `--frozen-lockfile` installs too, which is what makes it a
# real gate rather than an authoring-time nicety. pnpm runs a separate "Verifying
# lockfile against supply-chain policies" pass that checks EVERY existing lockfile
# entry, even when it skips resolution. Measured: temporarily raising this value
# fails `pnpm install --frozen-lockfile` with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION
# naming each entry. So a lockfile someone commits with a too-fresh (or freshly
# compromised) version is rejected by CI, not merely discouraged locally.
minimumReleaseAge: 4320

# Workspace packages resolve through the `workspace:` protocol, not the registry,
# so the cooldown never applies to them — but be explicit, so a future move to
# publishing these to a registry cannot deadlock our own releases.
minimumReleaseAgeExclude:
  - "@sitewright/*"

# Refuse transitive deps that resolve from git URLs, gists, or arbitrary tarballs
# rather than the registry. Default-on in pnpm 11; stated so a downgrade or a
# config move cannot quietly lose it.
blockExoticSubdeps: true

# `pnpm deploy --prod` builds the runtime image's node_modules (release.yml, and the CI snapshot
# job). From pnpm 10 it refuses to run unless the workspace injects workspace packages, failing with
# ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE — after having already created a PARTIAL output directory
# with sources but no node_modules, which is the exact shape that builds a broken image if anything
# ignores the exit code.
#
# `forceLegacyDeploy: true` is the documented escape hatch and it is WRONG HERE. Measured: it emits
#   node_modules/@sitewright/blocks -> ../../../../workspace/sitewright/packages/blocks
# i.e. symlinks pointing OUT of the deploy directory, back into the source checkout. pnpm 9 emitted
#   node_modules/@sitewright/blocks -> ../.pnpm/@sitewright+blocks@file+packages+blocks/...
# which stays inside it. Only the second survives being COPYed into an image; the first is a set of
# dangling links the moment it leaves this machine.
#
# So: inject, which materialises real copies inside the deploy output. This is what makes the result
# self-contained, and it is verified by diffing the deploy tree against the pnpm 9 one.
injectWorkspacePackages: true

# Advisory remediation. Prefer pinning here over an audit exemption: an override
# keeps `pnpm audit` telling the truth, whereas an ignored GHSA silently outlives
# the advisory that justified it.
overrides:
  # ── CORRECTNESS, not advisories ──
  # CodeMirror requires exactly ONE copy of @codemirror/state and @codemirror/view in the tree; two
  # copies produce mismatched nominal types (an EditorState from 6.7.1 is not assignable to one from
  # 6.6.0) and, worse, a silently broken editor at runtime, because plugin/facet identity is
  # per-instance. The Dependabot batch raised the DIRECT ranges while transitive deps kept resolving
  # the older versions, so the tree carried both — main had one version of each, this batch made it
  # two, and the editor typecheck failed exactly as CodeMirror's own docs warn it will.
  # Pin the whole family together; bump these as a set, never individually.
  #
  # ★★ THESE AND `apps/editor/package.json` MUST MOVE TOGETHER, and the manifest is deliberately an
  # EXACT version, not a range, so the two can be compared at a glance. An override WINS over a
  # manifest range, so a Dependabot PR that raises only the manifest installs NOTHING: the editor
  # declared ^6.7.4 / ^6.43.11 for weeks while 6.7.1 / 6.43.7 is what every import actually resolved
  # to, and the next bump would have said ^6.7.6 while still installing 6.7.1. A manifest that
  # misdescribes the tree is worse than a stale one, because it reads as true.
  #
  # So when Dependabot proposes a CodeMirror bump, treat it as the SIGNAL and do the work here:
  # raise all three to the proposed versions, mirror them into apps/editor/package.json, then VERIFY
  # with the thing that actually decides it —
  #   grep -oE "'@codemirror/(state|view|language)@[0-9.]+'" pnpm-lock.yaml | sort -u
  # which must print exactly one line per package. (Measured 2026-10-01: with these three removed,
  # the tree immediately carried TWO copies each of state and view — the pin is still load-bearing,
  # it is not a historical leftover.)
  "@codemirror/state": 6.7.6
  "@codemirror/view": 6.43.13
  "@codemirror/language": 6.12.4

  # ── Advisory remediation (see the note above the block) ──
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
  "@hono/node-server@<2.0.5": ^2.0.5
  "body-parser@<2.3.0": ^2.3.0
  # ★ Widened range. 5.0.9 fixed GHSA-v6h2-p8h4-qcjw; three more then landed (GHSA-6j4f-fj2g-mc7p
  # and GHSA-qhr7-859c-m2p7, stack exhaustion via uncontrolled recursion; GHSA-q2hr-2g5m-vwhr,
  # quadratic `{a},b}` expansion), with 5.0.12 as the fix for all three.
  "brace-expansion@<5.0.12": ^5.0.12
  # GHSA-c83g-rgw3-j3cx (unbounded memory growth → OOM) + GHSA-73wf-gq98-2v4g (uncaught crash /
  # prototype write via an untrusted browserslist-stats.json). Reached only through the BUILD
  # toolchain (@vitejs/plugin-react → babel, plus update-browserslist-db), so it is not in the
  # runtime container — pinned rather than accepted because a fix exists and an override keeps
  # `pnpm audit` honest.
  "browserslist@<4.28.7": ^4.28.7
  # ★ Widened range, the same way nanoid's did below: 3.1.5 was the fix, then four more advisories
  # (GHSA-5jgf-p345-68v8, -f65p-4m7j-42xc, -fph4-wmhf-6fwf, -jqff-g426-hqxp — host confusion and SSRF
  # via IDN/percent-decoding handling) landed with 3.1.6 as the fix, so the old pin started failing
  # the gate with no change on our side. It is in the RUNTIME tree (ajv → fastify).
  # ★ Widened AGAIN, and now in two lines because the tree carries both majors (ajv wants ^3,
  # @fastify/* wants ^4). 3.1.6 was the fix, then GHSA-58mr-gqgx-xq4g (host confusion via an
  # unclosed bracket) landed naming *3.1.6 itself* as affected, plus GHSA-qw65-cvwx-89v3
  # (authority injection via an unvalidated port) and GHSA-hrr3-gc8f-f4qj (host case
  # normalization). It is in the RUNTIME tree (ajv → fastify).
  # NB the audit output prints "fixed in: undefined" for GHSA-58mr-gqgx-xq4g — a display artifact:
  # the advisory patches = 2.4.5 → 2.4.6, = 3.1.6 → 3.1.7 and = 4.1.3 → 4.1.4, exact-version
  # ranges with no single global fix. Do not read that as "unfixable".
  "fast-uri@<3.1.8": ^3.1.8
  "fast-uri@>=4.0.0 <4.1.5": ^4.1.5
  # GHSA-wq5f-xc86-pv6w via the busboy CRLF-injection advisory: a multipart Content-Disposition
  # filename carrying CR/LF could inject header lines. `@fastify/multipart` is how every upload in
  # this platform arrives, so this is squarely in the runtime path.
  "@fastify/busboy@<3.2.2": ^3.2.2
  "find-my-way@<9.7.0": ^9.7.0
  "form-data@<4.0.6": ^4.0.6
  # ★ Widened range, the same story as fast-uri and nanoid below: 4.12.34 was the fix, then three more
  # advisories landed with 4.13.5 as the fix (GHSA-gqvv-2mrq-wpjv toSSG path traversal,
  # GHSA-g6gw-c38x-mqfc parseBody memory exhaustion, GHSA-crvj-82cr-hjcx query-parser cache-key
  # differential), so the old pin started failing the gate with no change on our side. It IS in the
  # runtime tree (@modelcontextprotocol/sdk → @hono/node-server), so this is not toolchain-only.
  "hono@<4.13.5": ">=4.13.5"
  # ★ Widened range: 10.3.1 was the fix, then four more landed through 10.7.1 — isLinkLocal()
  # reading fe80::/64 instead of fe80::/10 and no classifier for NAT64 64:ff9b:1::/48 (both
  # SSRF/trust-boundary bypasses), isInSubnet() comparing across address families, and an
  # unbounded parse diagnostic. It backs the SSRF guard, so these are reachable, not theoretical.
  "ip-address@<10.7.1": ^10.7.1
  # GHSA-2883-xcg3-v3hh — maxTotalMergeKeys does not bound CPU for empty merge sources. Same
  # widened-range pattern: 4.3.1 was the fix for the previous advisory, 4.3.2 is the fix for this one.
  # Dev-only (eslint → @eslint/eslintrc), pinned rather than accepted because a fix exists.
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  # GHSA-2v37-7h3g-55p8 — a custom generator loops forever on size 0. Reached transitively through
  # postcss (sanitize-html → @sitewright/blocks), so it is in the RUNTIME tree, not just the toolchain.
  # ★ The advisory's affected RANGE was widened after we first pinned it: 3.3.17 was the fix, then was
  # itself marked vulnerable and 3.3.18 became the fix. So an override that was correct when written
  # started failing the gate with no change on our side — worth knowing the next time a pinned advisory
  # reappears out of nowhere. Re-check the advisory's range before assuming the pin is stale.
  "nanoid@<3.3.18": ^3.3.18
  # ★ Now a MAJOR floor (9 → 10): four advisories land past 9.x with no 9-line backport —
  # GHSA-6vj9-mwq6-2f5v (a process-global DNS cache reusing the TLS `servername` ACROSS
  # transports, i.e. cross-tenant SMTP credential disclosure, which for a platform sending as
  # many different clients is the one that matters), two addressparser DoS bugs, and a malformed
  # envelope recipient. 10.0.9 is the floor; 10.0.12 is what resolves.
  "nodemailer@<10.0.9": ">=10.0.9"
  # GHSA — IP spoofing via IPv4-mapped IPv6 addresses: `proxy-addr` trusted a mapped form that
  # bypasses a configured trust list. Reached through @modelcontextprotocol/sdk's express, which the
  # MCP server runs, and this platform makes trust decisions from client IPs (rate limits, the SSRF
  # guard's notion of a remote peer) — so it is reachable, not theoretical.
  "proxy-addr@<2.0.8": ^2.0.8
  "postcss@<8.5.18": ^8.5.18
  # Event-loop DoS through an unbounded regex in the mappings parser. Dev/toolchain only
  # (@vitest/coverage-v8 → magicast, and vite → postcss), so it is not in the runtime container —
  # pinned rather than accepted because a fix exists and ACCEPTED is deliberately empty.
  "source-map-js@<1.2.2": ^1.2.2
  # GHSA-x5fp-wj9c-mxmx (array-limit bypass via bracket-key comma parsing) + GHSA-4mjr-xmp4-gh2g
  # (DoS via an attacker-controlled isBuffer). Reached through body-parser/express in the deploy
  # tooling; 6.16.0 covers both ranges.
  "qs@<6.16.0": ^6.16.0
  # ★ Widened range — the recurring shape again. 1.9.0 was the fix for the previous advisory and the
  # tree had floated to 1.10.0; then GHSA for `quote()` command injection via a line terminator landed
  # naming >=1.8.4 <1.11.0 as affected, so 1.10.0 became vulnerable with no change on our side.
  # Reached through drizzle-orm's `gel` driver, which this platform never loads — pinned anyway,
  # because an override keeps `pnpm audit` honest and costs nothing.
  "shell-quote@<1.11.0": ^1.11.0

# Deliberately EMPTY and it should stay that way — advisory acceptances live in scripts/audit-gate.mjs,
# where they carry a reason and a stale one is a hard failure. An `ignore` here would instead make
# `pnpm audit` itself stop reporting the advisory, which is how the previous three exemptions managed
# to outlive the advisories that justified them.
# (pnpm deprecates `auditConfig` in favour of `audit.ignore`; kept as-is because it is empty and only
# documents the intent. Migrate whenever pnpm actually drops it.)
auditConfig:
  ignoreGhsas: []

# Install scripts run arbitrary code at install time — the single most-used vector
# in every recent registry-compromise worm. They are DENIED by default; this map
# is the allowlist, and `true` here is a real grant. Justify additions in review.
#
# This REPLACES the v9/v10 `onlyBuiltDependencies` list, which pnpm 11 no longer
# reads. The three `true` entries are exactly what that list allowed, so this
# migration changes no behaviour. The `false` entries were already blocked (they
# were simply absent from the old list) — stated explicitly so the next person
# sees a decision rather than an omission, and so `pnpm install` stops asking.
allowBuilds:
  # Bundles the vendored component runtimes (scripts/gen-vendor.mjs) and backs vite.
  esbuild: true
  # Native binary: the Tailwind v4 engine.
  "@tailwindcss/oxide": true
  # Native binary: the image pipeline (thumbnails, WebP variants).
  sharp: true
  # Optional native crypto acceleration for ssh2, itself only used by the SFTP
  # deploy target. Pure-JS fallbacks cover both; neither has ever been built here.
  ssh2: false
  cpu-features: false
